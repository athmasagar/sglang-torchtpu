# Kueue gang-admits the TPU CI JobSets. Install and verification: README "Enabling Kueue".
#
# One ResourceFlavor per pool (ci-tpu-pool label). GKE tpu7x nodes expose no per-slice
# label, so a multi-host pool must hold exactly one slice.
# One ClusterQueue per (lane, hosts), matching topology.yaml's `queue`.
#
# Quotas here are a startup default: reconcile_quota.py resets them from live chips before
# every CI job. cpu and memory are derived from the chip count (pods take 4 chips / 4 cpu /
# 32Gi, so 1 cpu and 8Gi per chip) to keep TPU the only binding resource. Every resource a
# pod requests must appear in coveredResources or nothing is admittable.
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: tpu7x-2x2x1-ci
spec:
  nodeLabels:
    ci-tpu-pool: ci-2x2x1
  tolerations:
    - key: google.com/tpu
      operator: Exists
      effect: NoSchedule
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: tpu7x-2x2x2-nightly
spec:
  nodeLabels:
    ci-tpu-pool: nightly
  tolerations:
    - key: google.com/tpu
      operator: Exists
      effect: NoSchedule
---
# pr-gate and nightly share the 2x2x1 pool (topology.yaml `merged_pools`). The same
# cohortName is what lets one queue use the other's idle quota.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: tpu-prgate-1h
spec:
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  cohortName: ci-2x2x1
  resourceGroups:
    - coveredResources: ["google.com/tpu", "cpu", "memory"]
      flavors:
        - name: tpu7x-2x2x1-ci
          resources:
            - name: "google.com/tpu"
              nominalQuota: 20
              # pr-gate's hosts are never lent, so a PR never waits behind nightly.
              lendingLimit: 0
            - name: "cpu"
              nominalQuota: 20
            - name: "memory"
              nominalQuota: 160Gi
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: tpu-nightly-1h
spec:
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  cohortName: ci-2x2x1
  resourceGroups:
    - coveredResources: ["google.com/tpu", "cpu", "memory"]
      flavors:
        - name: tpu7x-2x2x1-ci
          resources:
            - name: "google.com/tpu"
              nominalQuota: 12
            - name: "cpu"
              nominalQuota: 12
            - name: "memory"
              nominalQuota: 96Gi
---
# One 2x2x2 slice = 8 chips = one concurrent 2-host job.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: tpu-nightly-2h
spec:
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  resourceGroups:
    - coveredResources: ["google.com/tpu", "cpu", "memory"]
      flavors:
        - name: tpu7x-2x2x2-nightly
          resources:
            - name: "google.com/tpu"
              nominalQuota: 8
            - name: "cpu"
              nominalQuota: 8
            - name: "memory"
              nominalQuota: 64Gi
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: tpu-prgate-1h
  namespace: tpu-ci
spec:
  clusterQueue: tpu-prgate-1h
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: tpu-nightly-1h
  namespace: tpu-ci
spec:
  clusterQueue: tpu-nightly-1h
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: tpu-nightly-2h
  namespace: tpu-ci
spec:
  clusterQueue: tpu-nightly-2h
