# The slice for a given (lane, host count). A suite or launch group declares only a lane and
# a host count; topology, pool and queue are looked up here.
#
#   topology : cloud.google.com/gke-tpu-topology node label
#   pools    : ci-tpu-pool node labels -- one pool per multi-host slice. A list because a
#              (lane, hosts) can own several interchangeable slices; Kueue picks one via its
#              ResourceFlavor, and the pod's nodeAffinity restricts it to this set, which is
#              what keeps CI off the dev pools when Kueue is not managing the JobSet.
#              A FLOOR, not the whole truth: discover_pools.py unions this with every pool
#              labelled ci-tpu-lane=<lane> of the same slice shape, so a new slice needs no
#              edit here. Label a new pool with BOTH ci-tpu-pool (unique) and ci-tpu-lane.
#              Listing a pool that no longer exists is harmless; omitting a live one that
#              lacks ci-tpu-lane is not, which is why this stays a floor rather than a cache.
#   queue    : Kueue LocalQueue in tpu-ci (kueue-tpu.yaml). One per (lane, hosts): a 2-host
#              job's 8 chips would satisfy a single-host flavor's quota while being
#              unschedulable, so the shapes must not share a ClusterQueue.
#   min_hosts: on a pool two lanes share, the hosts this lane always keeps. The other lane
#              holds the rest, gets freed hosts first, and lends them while it is idle.
#              reconcile_quota.py turns this into both queues' quotas from live hosts.
lanes:
  pr-gate:
    1: { topology: 2x2x1, pools: [ci-2x2x1], queue: tpu-prgate-1h, min_hosts: 5 }
  nightly:
    1: { topology: 2x2x1, pools: [ci-2x2x1], queue: tpu-nightly-1h }
    2: { topology: 2x2x2, pools: [nightly],  queue: tpu-nightly-2h }  # 1 slice = 2 hosts
