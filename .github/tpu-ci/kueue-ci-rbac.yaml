# Lets the CI service account keep Kueue in step with the live pools: reconcile_quota.py
# patches the CI ClusterQueues' quotas, discover_pools.py --sync creates a new pool's flavor.
# Its project role (container.developer) covers namespaced objects only, and these are
# cluster-scoped. Apply once with cluster-admin (README "Enabling Kueue", step 3).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tpu-ci-kueue-sync
rules:
  # Only the CI queues in kueue-tpu.yaml; add a new CI queue here too.
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["clusterqueues"]
    resourceNames:
      - tpu-prgate-1h
      - tpu-nightly-1h
      - tpu-nightly-2h
    verbs: ["get", "patch"]
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["clusterqueues", "resourceflavors"]
    verbs: ["list"]
  # create cannot be limited by name; deletion is never granted.
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["resourceflavors"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tpu-ci-kueue-sync
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tpu-ci-kueue-sync
subjects:
  # A Google service account authenticates to GKE as a User named by its email.
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: tpu-ci@sglang-torchtpu.iam.gserviceaccount.com
